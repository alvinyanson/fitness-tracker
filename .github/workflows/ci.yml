# =============================================================================
# CI — what happens and when
# =============================================================================
#
# STEP 1  Every PR and every push to main: install, lint, typecheck, test.
# STEP 2  Detect what changed (native files vs JS/assets).
# STEP 3  Set up EAS — only if app files changed (docs/CI-only changes stop here).
#
# STEP 4a On a PR (feature branch -> main):
#           Publish an EAS update to a temporary EAS branch named after the PR
#           and post a QR code comment on the PR so reviewers can preview it.
#           NOTE: if the PR has native changes, older APKs will show
#           "No compatible update found" — that is expected.
#
# STEP 4b On merge to main:
#           Native files changed -> start a new Development APK build on EAS
#                                   (download it from expo.dev > Builds).
#           Only JS/assets       -> send an OTA update to the "development"
#                                   channel (dev phones update on next launch).
#
# Native files = package.json, pnpm-lock.yaml, app.json, eas.json, plugins/
# (they feed the runtime fingerprint, so changing them needs a new APK).
#
# QA releases are NOT here — they run from .eas/workflows/preview.yml
# (triggered on-demand from Expo dashboard > Workflows).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed to the same PR to save compute time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for the EAS preview comment on PRs

    steps:
      # -----------------------------------------------------------------------
      # STEP 1 — Verify code quality (runs on every PR and every merge)
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Setup pnpm BEFORE Node so that setup-node can execute `pnpm store path` to locate the cache
      # Version is read automatically from package.json "packageManager" field
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm' # Caches the pnpm global store to drastically speed up installations

      # Enforce frozen-lockfile to ensure deterministic builds and prevent hidden dependency drift
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test --ci

      # -----------------------------------------------------------------------
      # STEP 2 — Decide what changed (used by every EAS step below)
      #   native = true  -> native files changed (needs a new APK)
      #   app    = true  -> anything app-related changed (native or JS/assets)
      #   PR compares against main; merge compares against the previous commit.
      # -----------------------------------------------------------------------
      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/main...HEAD"
          else
            RANGE="HEAD~1 HEAD"
          fi
          NATIVE=$(git diff --name-only $RANGE -- package.json pnpm-lock.yaml app.json eas.json plugins/ | head -1)
          APP=$(git diff --name-only $RANGE -- src/ assets/ | head -1)
          echo "native=$([ -n "$NATIVE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "app=$([ -n "$NATIVE$APP" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # STEP 3 — Set up EAS CLI (skipped for docs/CI-only changes)
      # Token check is from Expo's guide: https://docs.expo.dev/eas-update/github-actions/
      # -----------------------------------------------------------------------
      - name: Check for EXPO_TOKEN
        if: steps.changes.outputs.app == 'true'
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Setup EAS
        if: steps.changes.outputs.app == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # -----------------------------------------------------------------------
      # STEP 4a — PR ONLY: publish preview update + post QR code on the PR
      # -----------------------------------------------------------------------
      # Attach the PR branch name to the merge commit so `eas update --auto`
      # publishes under the feature branch name in the EAS dashboard instead of "HEAD".
      - name: Attach PR branch name for EAS
        if: github.event_name == 'pull_request' && steps.changes.outputs.app == 'true'
        run: git checkout -B ${{ github.head_ref }}

      - name: Create preview
        if: github.event_name == 'pull_request' && steps.changes.outputs.app == 'true'
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --platform android --auto

      # -----------------------------------------------------------------------
      # STEP 4b — MERGE TO MAIN ONLY: update the development environment
      #   native changed -> new Development APK build (https://docs.expo.dev/build/building-on-ci/)
      #   JS-only        -> OTA update to the "development" channel
      # -----------------------------------------------------------------------
      - name: Deploy to development
        if: github.event_name == 'push' && steps.changes.outputs.app == 'true'
        run: |
          if [ "${{ steps.changes.outputs.native }}" = "true" ]; then
            eas build --platform android --profile development --non-interactive --no-wait
          else
            eas update --channel development --environment development --platform android \
              --message "$(git log -1 --pretty=%s)" --non-interactive
          fi
